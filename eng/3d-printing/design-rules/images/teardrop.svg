<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 200' width='440' height='200' role='img' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A round horizontal hole droops at the top; a teardrop hole does not</title><rect width='440' height='200' rx='10' fill='#fff'/><text x='110' y='26' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#666' font-weight='normal'>Round horizontal hole</text><text x='330' y='26' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#666' font-weight='normal'>Teardrop</text><rect x='40' y='40' width='140' height='120' fill='#ED7D31' stroke='#5A3A22' stroke-width='2'/><circle cx='110' cy='105' r='35' fill='#fff' stroke='#5A3A22' stroke-width='2'/><path d='M85.3,80.3 A35,35 0 0 1 134.7,80.3' fill='none' stroke='#C0392B' stroke-width='5'/><circle cx='175' cy='40' r='13' fill='#C0392B'/><path d='M170,35 l10,10 M180,35 l-10,10' stroke='#fff' stroke-width='3' stroke-linecap='round'/><rect x='260' y='40' width='140' height='120' fill='#ED7D31' stroke='#5A3A22' stroke-width='2'/><path d='M305.3,80.3 L330,55.5 L354.7,80.3 A35,35 0 1 1 305.3,80.3 Z' fill='#fff' stroke='#5A3A22' stroke-width='2'/><circle cx='395' cy='40' r='13' fill='#2E8B57'/><path d='M389,40 l4,5 l8,-10' fill='none' stroke='#fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='110' y='185' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>The top goes flat: droops</text><text x='330' y='185' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Roof at 45°: prints clean</text></svg>