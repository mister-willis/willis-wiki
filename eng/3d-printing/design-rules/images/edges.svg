<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 230' width='560' height='230' role='img' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Rounded vertical corners; a chamfer on the bottom edge instead of a fillet</title><rect width='560' height='230' rx='10' fill='#fff'/><text x='120' y='28' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#666' font-weight='normal'>Top view</text><rect x='50' y='55' width='140' height='100' rx='22' fill='#ED7D31' stroke='#5A3A22' stroke-width='2'/><circle cx='205' cy='45' r='13' fill='#2E8B57'/><path d='M199,45 l4,5 l8,-10' fill='none' stroke='#fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='120' y='190' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>Fillet vertical edges</text><text x='120' y='210' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>(rounded corners resist warping)</text><text x='390' y='28' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#666' font-weight='normal'>Side view, bottom edge</text><rect x='265' y='150' width='120' height='10' fill='#B9BEC6' stroke='#7D838C'/><polygon points='290.0,150.0 280.0,140.0 280.0,70.0 370.0,70.0 370.0,150.0' fill='#ED7D31' stroke='#5A3A22' stroke-width='2' stroke-linejoin='round' /><circle cx='375' cy='55' r='13' fill='#2E8B57'/><path d='M369,55 l4,5 l8,-10' fill='none' stroke='#fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='325' y='190' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>Chamfer</text><text x='325' y='210' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>hides elephant foot</text><rect x='410' y='150' width='125' height='10' fill='#B9BEC6' stroke='#7D838C'/><path d='M435,150 A20,20 0 0 1 415,130 L415,70 L505,70 L505,150 Z' fill='#ED7D31' stroke='#5A3A22' stroke-width='2'/><path d='M435,150 A20,20 0 0 1 425.5,147.5' fill='none' stroke='#C0392B' stroke-width='5'/><circle cx='520' cy='55' r='13' fill='#C0392B'/><path d='M515,50 l10,10 M525,50 l-10,10' stroke='#fff' stroke-width='3' stroke-linecap='round'/><text x='460' y='190' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>Fillet</text><text x='460' y='210' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>starts flat: an overhang</text></svg>