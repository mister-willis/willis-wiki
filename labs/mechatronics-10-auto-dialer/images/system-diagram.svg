<rect width="1020" height="670" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:22px;font-weight:bold}.body{font-size:17px}.note{font-size:16px} .link{fill:none;stroke:#39556c;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="30" y="35" class="title">Functional Interfaces • Choose Your Own Mechanical Layout</text>
<rect x="30" y="65" width="290" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="46" y="95" class="title">Inputs</text>
<text x="46" y="125" class="body">Start / stop controls</text>
<text x="46" y="148" class="body">Open-state sensor</text>
<rect x="380" y="65" width="260" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="396" y="95" class="title">Arduino</text>
<text x="396" y="125" class="body">Sequence and timing</text>
<text x="396" y="148" class="body">Success / fault logic</text>
<rect x="700" y="65" width="290" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="716" y="95" class="title">Outputs</text>
<text x="716" y="125" class="body">Status indicator</text>
<text x="716" y="148" class="body">Trial log</text>
<rect x="30" y="240" width="450" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="46" y="270" class="title">Stepper + compatible driver</text>
<text x="46" y="300" class="body">Dial positioning through a coupling</text>
<text x="46" y="323" class="body">Motor power from an approved supply</text>
<rect x="540" y="240" width="450" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
