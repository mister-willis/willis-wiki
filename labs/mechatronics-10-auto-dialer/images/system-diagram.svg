<text x="556" y="300" class="body">Normal opening / checking motion</text>
<text x="556" y="323" class="body">Bounded travel; no forcing the lock</text>
<rect x="30" y="425" width="450" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="46" y="455" class="title">Supported 6 mm shaft</text>
<text x="46" y="485" class="body">Two bearings, shaft retention, printed parts</text>
<text x="46" y="508" class="body">Contact with the dial; alignment matters</text>
<rect x="540" y="425" width="450" height="110" rx="12" fill="#eef4fa" stroke="#58748c" stroke-width="2"/>
<text x="556" y="455" class="title">Opening mechanism</text>
<text x="556" y="485" class="body">Acts on the normal opening interface</text>
<text x="556" y="508" class="body">Sensor reports open or still locked</text>
