<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rectangle -->
  <g transform="translate(20,30)">
    <rect x="0" y="20" width="140" height="70" fill="#4f46e5" fill-opacity="0.12"/>
    <text x="70" y="8" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Rectangle</text>
    <text x="70" y="112" text-anchor="middle" stroke="none" fill="currentColor">1 rectangle</text>
  </g>
  <!-- Pointed bow -->
  <g transform="translate(200,30)">
    <polygon points="0,20 100,20 150,55 100,90 0,90" fill="#4f46e5" fill-opacity="0.12"/>
    <line x1="100" y1="20" x2="100" y2="90" stroke-dasharray="6 4"/>
    <text x="75" y="8" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Pointed bow</text>
    <text x="75" y="112" text-anchor="middle" stroke="none" fill="currentColor">rectangle + triangle</text>
  </g>
  <!-- Hexagon -->
  <g transform="translate(400,30)">
    <polygon points="0,55 40,20 120,20 160,55 120,90 40,90" fill="#4f46e5" fill-opacity="0.12"/>
    <line x1="40" y1="20" x2="40" y2="90" stroke-dasharray="6 4"/>
    <line x1="120" y1="20" x2="120" y2="90" stroke-dasharray="6 4"/>
    <text x="80" y="8" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Hexagon</text>
    <text x="80" y="112" text-anchor="middle" stroke="none" fill="currentColor">rectangle + 2 triangles</text>
  </g>
  <!-- Stadium -->
  <g transform="translate(620,30)">
    <path d="M35,20 H125 A35,35 0 0 1 125,90 H35 A35,35 0 0 1 35,20 Z" fill="#4f46e5" fill-opacity="0.12"/>
    <line x1="35" y1="20" x2="35" y2="90" stroke-dasharray="6 4"/>
    <line x1="125" y1="20" x2="125" y2="90" stroke-dasharray="6 4"/>
    <text x="80" y="8" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Stadium</text>
    <text x="80" y="112" text-anchor="middle" stroke="none" fill="currentColor">rectangle + 2 half circles</text>
    <text x="80" y="128" text-anchor="middle" stroke="none" fill="currentColor">(= rectangle + 1 circle)</text>
  </g>
  <!-- Teardrop -->
  <g transform="translate(300,190)">
    <path d="M0,55 L100,15 A40,40 0 0 1 100,95 Z" fill="#4f46e5" fill-opacity="0.12"/>
    <line x1="100" y1="15" x2="100" y2="95" stroke-dasharray="6 4"/>
    <text x="70" y="4" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Teardrop</text>
    <text x="70" y="118" text-anchor="middle" stroke="none" fill="currentColor">triangle + half circle</text>
  </g>
  <!-- Legend -->
  <g transform="translate(560,240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke-dasharray="6 4"/>
    <text x="48" y="4" stroke="none" fill="currentColor">cut here: each piece is a shape you can calculate</text>
  </g>
</svg>
