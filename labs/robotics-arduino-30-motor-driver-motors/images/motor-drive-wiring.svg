ke="#d33238" stroke-width="4" stroke-linejoin="round"/><circle cx="285" cy="465" r="4" fill="#d33238" stroke="none"/><circle cx="590" cy="410" r="4" fill="#d33238" stroke="none"/><path d="M 285,505 L 500,505 L 500,450 L 590,450" fill="none" stroke="#f6f8fb" stroke-width="10" stroke-linejoin="round"/><path d="M 285,505 L 500,505 L 500,450 L 590,450" fill="none" stroke="#263442" stroke-width="4" stroke-linejoin="round"/><circle cx="285" cy="505" r="4" fill="#263442" stroke="none"/><circle cx="590" cy="450" r="4" fill="#263442" stroke="none"/><path d="M 285,770 L 400,770 L 400,490 L 590,490" fill="none" stroke="#f6f8fb" stroke-width="10" stroke-linejoin="round"/><path d="M 285,770 L 400,770 L 400,490 L 590,490" fill="none" stroke="#263442" stroke-width="4" stroke-linejoin="round"/><circle cx="285" cy="770" r="4" fill="#263442" stroke="none"/><circle cx="590" cy="490" r="4" fill="#263442" stroke="none"/><path d="M 285,810 L 430,810 L 430,530 L 590,530" fill="none" stroke="#f6f8fb" stroke-width="10" stroke-linejoin="round"/><path d="M 285,810 L 430,810 L 430,530 L 590,530" fill="none" stroke="#d33238" stroke-width="4" stroke-linejoin="round"/><circle cx="285" cy="810" r="4" fill="#d33238" stroke="none"/><circle cx="590" cy="530" r="4" fill="#d33238" stroke="none"/><rect x="910" y="390" width="125" height="43" rx="10" fill="#fff0ce" stroke="none"/><text x="926" y="417" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="600" text-anchor="start">5V: NO WIRE</text><rect x="590" y="710" width="775" height="142" rx="10" fill="#e5edf5" stroke="none"/><text x="606" y="737" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="600" text-anchor="start">Read the labels, then connect</text><text x="606" y="760" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="400" text-anchor="start">M1A/M1B and M2A/M2B appear twice: screw terminals go to motors;</text><text x="606" y="783" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="400" text-anchor="start">small header pins go to Arduino. The 5V header stays disconnected.</text><text x="606" y="806" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="400" text-anchor="start">Motor wire colors show the initial setup. Swap a motor’s leads with</text><text x="606" y="829" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223c52" font-weight="400" text-anchor="start">power OFF if needed to calibrate its forward direction.</text><rect x="24" y="949" width="1372" height="71" rx="10" fill="#e6edf3" stroke="none"/><text x="42" y="977" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#20394e" font-weight="600" text-anchor="start">Illustrations and selected Uno pins are simplified; match terminal names on the actual hardware.</text><text x="42" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#405a70" font-weight="400" text-anchor="start">Disconnect USB and switch the battery OFF before wiring. Line crossings are not junctions.</text></svg>
